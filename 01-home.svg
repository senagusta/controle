<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="Arial, Helvetica, sans-serif">
  <style>
    .title{font-size:20px;font-weight:700;fill:#111}.label{font-size:16px;font-weight:700;fill:#1f2937}
    .sub{font-size:13px;fill:#374151}.small{font-size:12px;fill:#374151}.muted{font-size:12px;fill:#6b7280}
    .frame{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}
    .header{fill:#e5e7eb;stroke:#94a3b8}.btnp{fill:#2563eb;stroke:#1d4ed8}.btns{fill:#ffffff;stroke:#2563eb}
    .btnt{font-size:12px;fill:#fff;font-weight:700}.btnts{font-size:12px;fill:#2563eb;font-weight:700}
    .flash{fill:#dcfce7;stroke:#86efac}.flasht{font-size:11px;fill:#166534}
    .card{fill:#fff;stroke:#cbd5e1}
  </style>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="40" y="40" class="title">01 - Home (home) — público</text>
  <text x="40" y="62" class="muted">Base: TELAS.md. Estados: carregamento navegação padrão; sucesso exibe flash (ex.: logout).</text>

  <!-- Mobile -->
  <text x="40" y="100" class="label">CELULAR (360px)</text>
  <rect x="40" y="115" width="320" height="520" rx="18" class="frame"/>
  <rect x="60" y="140" width="280" height="40" class="header"/>
  <text x="75" y="165" class="sub" font-weight="700">TechPath</text>
  <text x="315" y="165" class="sub">≡</text>
  <rect x="60" y="190" width="280" height="28" rx="4" class="flash"/>
  <text x="70" y="208" class="flasht">[flash sucesso] Você saiu da conta</text>
  <text x="80" y="250" class="label">Bem-vindo ao TechPath</text>
  <text x="80" y="275" class="small">Descubra áreas de tecnologia,</text>
  <text x="80" y="292" class="small">inicie trilhas e acompanhe seu</text>
  <text x="80" y="309" class="small">progresso.</text>
  <rect x="80" y="340" width="240" height="34" rx="6" class="btnp"/>
  <text x="150" y="362" class="btnt">Criar conta</text>
  <rect x="80" y="384" width="240" height="34" rx="6" class="btns"/>
  <text x="170" y="406" class="btnts">Entrar</text>
  <rect x="80" y="428" width="240" height="34" rx="6" class="btns"/>
  <text x="145" y="450" class="btnts">Explorar áreas</text>
  <text x="80" y="482" class="muted">(se logado: [Ir para meu painel])</text>
  <rect x="60" y="585" width="280" height="35" class="header"/>
  <text x="165" y="607" class="muted">Rodapé</text>

  <!-- Desktop -->
  <text x="420" y="100" class="label">DESKTOP</text>
  <rect x="420" y="115" width="740" height="520" class="frame"/>
  <rect x="440" y="135" width="700" height="45" class="header"/>
  <text x="455" y="163" class="sub" font-weight="700">TechPath  Home  Áreas</text>
  <rect x="980" y="145" width="70" height="26" rx="4" class="btns"/><text x="995" y="163" class="btnts" font-size="11">Entrar</text>
  <rect x="1055" y="145" width="80" height="26" rx="4" class="btnp"/><text x="1065" y="163" class="btnt" font-size="11">Criar conta</text>
  <text x="650" y="250" class="label">Bem-vindo ao TechPath</text>
  <text x="560" y="275" class="small">Descubra áreas de tecnologia, inicie trilhas e acompanhe seu progresso</text>
  <rect x="470" y="320" width="190" height="120" rx="8" class="card"/>
  <text x="525" y="360" class="sub" font-weight="700">Criar conta</text>
  <rect x="510" y="385" width="110" height="30" rx="5" class="btnp"/><text x="530" y="405" class="btnt">Criar conta</text>
  <rect x="695" y="320" width="190" height="120" rx="8" class="card"/>
  <text x="770" y="360" class="sub" font-weight="700">Entrar</text>
  <rect x="745" y="385" width="90" height="30" rx="5" class="btns"/><text x="770" y="405" class="btnts">Entrar</text>
  <rect x="920" y="320" width="190" height="120" rx="8" class="card"/>
  <text x="965" y="360" class="sub" font-weight="700">Explorar áreas</text>
  <rect x="955" y="385" width="120" height="30" rx="5" class="btns"/><text x="970" y="405" class="btnts">Explorar áreas</text>
  <rect x="440" y="580" width="700" height="35" class="header"/>
  <text x="760" y="602" class="muted">Rodapé</text>
</svg>
