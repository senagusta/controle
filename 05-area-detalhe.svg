<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="Arial, Helvetica, sans-serif">
  <style>
    .title{font-size:20px;font-weight:700;fill:#111}.label{font-size:16px;font-weight:700;fill:#1f2937}
    .sub{font-size:13px;fill:#374151}.small{font-size:12px;fill:#374151}.muted{font-size:12px;fill:#6b7280}
    .frame{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}.header{fill:#e5e7eb;stroke:#94a3b8}
    .btnp{fill:#2563eb;stroke:#1d4ed8}.btnt{font-size:12px;fill:#fff;font-weight:700}
    .btns{fill:#fff;stroke:#2563eb}.btnts{font-size:12px;fill:#2563eb;font-weight:700}
    .link{font-size:12px;fill:#2563eb}.flasherr{fill:#fee2e2;stroke:#fca5a5}.flasht{font-size:11px;fill:#991b1b}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>
  <text x="40" y="40" class="title">05 - Detalhe da área (area&amp;id=) — F2, público</text>
  <text x="40" y="62" class="muted">Sucesso: nome e descrição completa. Erro: id inválido → 404; falha consulta → [flash erro] Não foi possível carregar esta área.</text>

  <text x="40" y="100" class="label">CELULAR (360px)</text>
  <rect x="40" y="115" width="320" height="460" rx="18" class="frame"/>
  <rect x="60" y="140" width="280" height="40" class="header"/><text x="75" y="165" class="sub" font-weight="700">TechPath</text><text x="315" y="165" class="sub">≡</text>
  <text x="75" y="205" class="link">← Voltar para áreas</text>
  <text x="75" y="240" class="label">Desenvolvimento de software</text>
  <text x="75" y="270" class="small">É a área em que pessoas criam</text>
  <text x="75" y="287" class="small">programas, sites e aplicativos.</text>
  <text x="75" y="304" class="small">Você aprende a transformar ideias</text>
  <text x="75" y="321" class="small">em soluções usando lógica e</text>
  <text x="75" y="338" class="small">código, passo a passo.</text>
  <rect x="75" y="365" width="140" height="34" rx="6" class="btnp"/><text x="100" y="387" class="btnt">Ver trilhas</text>
  <text x="75" y="420" class="muted">(visitante: [Entrar para ver trilhas])</text>
  <rect x="60" y="450" width="280" height="24" rx="4" class="flasherr"/><text x="70" y="466" class="flasht">Erro: Não foi possível carregar esta área.</text>

  <text x="420" y="100" class="label">DESKTOP</text>
  <rect x="420" y="115" width="740" height="460" class="frame"/>
  <rect x="440" y="135" width="700" height="45" class="header"/><text x="455" y="163" class="sub">Header</text>
  <text x="455" y="210" class="link">← Voltar para áreas</text>
  <text x="455" y="245" class="label">Desenvolvimento de software</text>
  <line x1="455" y1="255" x2="1120" y2="255" stroke="#d1d5db"/>
  <text x="455" y="285" class="small">Descrição completa da área em linguagem acessível...</text>
  <text x="455" y="305" class="small">É a área em que pessoas criam programas, sites e aplicativos. Você aprende a transformar ideias em soluções</text>
  <text x="455" y="322" class="small">usando lógica e código, passo a passo.</text>
  <rect x="455" y="350" width="120" height="34" rx="6" class="btnp"/><text x="478" y="372" class="btnt">Ver trilhas</text>
  <text x="455" y="420" class="muted">Se id inválido/inexistente: exibe tela 404 amigável.</text>
</svg>
