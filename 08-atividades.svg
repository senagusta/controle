<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" font-family="Arial, Helvetica, sans-serif">
  <style>
    .title{font-size:20px;font-weight:700;fill:#111}.label{font-size:16px;font-weight:700;fill:#1f2937}
    .sub{font-size:13px;fill:#374151;font-weight:700}.small{font-size:12px;fill:#374151}.muted{font-size:12px;fill:#6b7280}
    .frame{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}.header{fill:#e5e7eb;stroke:#94a3b8}
    .card{fill:#fff;stroke:#cbd5e1}.btnp{fill:#2563eb;stroke:#1d4ed8}.btnt{font-size:11px;fill:#fff;font-weight:700}
    .barbg{fill:#e5e7eb}.bar{fill:#2563eb}.done{fill:#f0fdf4;stroke:#86efac}.donet{font-size:12px;fill:#166534}
    .link{font-size:12px;fill:#2563eb}.flashok{fill:#dcfce7;stroke:#86efac}.flashokt{font-size:11px;fill:#166534}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>
  <text x="40" y="40" class="title">08 - Atividades da trilha (atividades&amp;trilha_id=) — F4, protegido</text>
  <text x="40" y="62" class="muted">Acesso: trilha iniciada (RN12). Carregamento: "Salvando...". Sucesso: item concluído, barra atualiza. Vazios: todas concluídas / sem atividades. Erro: bloqueio RN12 ou falha.</text>

  <text x="40" y="100" class="label">CELULAR (360px) — em andamento</text>
  <rect x="40" y="115" width="320" height="720" rx="18" class="frame"/>
  <rect x="60" y="140" width="280" height="40" class="header"/><text x="75" y="165" class="small" font-weight="700">TechPath</text><text x="315" y="165" class="small">≡</text>
  <text x="75" y="205" class="link">← Meu painel</text>
  <text x="75" y="230" class="sub">Atividades: Desenvolvimento Web</text>
  <text x="75" y="250" class="small">Progresso: 2 de 6 (33%)</text>
  <rect x="75" y="258" width="250" height="10" rx="5" class="barbg"/><rect x="75" y="258" width="82" height="10" rx="5" class="bar"/>
  <rect x="75" y="275" width="250" height="22" rx="4" class="flashok"/><text x="82" y="290" class="flashokt">[flash sucesso] Atividade concluída!</text>
  <text x="75" y="315" class="sub">Pendentes</text>
  <rect x="70" y="322" width="260" height="85" rx="6" class="card"/>
  <text x="85" y="345" class="small" font-weight="700">3. HTML</text><text x="85" y="362" class="small">Estruture páginas.</text>
  <rect x="85" y="372" width="170" height="26" rx="4" class="btnp"/><text x="98" y="389" class="btnt">Marcar como concluída</text>
  <rect x="70" y="415" width="260" height="55" rx="6" class="card"/>
  <text x="85" y="438" class="small" font-weight="700">4. CSS</text>
  <rect x="200" y="422" width="110" height="24" rx="4" class="btnp"/><text x="228" y="438" class="btnt">Marcar</text>
  <text x="75" y="495" class="sub">Concluídas</text>
  <rect x="70" y="502" width="260" height="55" rx="6" class="done"/>
  <text x="85" y="522" class="donet">✓ 1. Fundamentos da tecnologia</text>
  <text x="85" y="540" class="donet">✓ 2. Introdução à programação</text>
  <text x="75" y="585" class="label">Estados</text>
  <text x="75" y="605" class="small">100%: "Você concluiu todas as atividades</text>
  <text x="75" y="622" class="small">desta trilha! Parabéns!" (sem pendentes)</text>
  <text x="75" y="645" class="small">Carregando item: [ Salvando... ]</text>
  <text x="75" y="665" class="small">Erro RN12: bloqueio sem gravação + flash</text>
  <text x="75" y="685" class="small">Erro: "Não foi possível registrar..."</text>

  <text x="420" y="100" class="label">DESKTOP</text>
  <rect x="420" y="115" width="740" height="720" class="frame"/>
  <rect x="440" y="135" width="700" height="45" class="header"/><text x="455" y="163" class="small">Header (logado)</text>
  <text x="455" y="210" class="link">← Meu painel</text>
  <text x="560" y="210" class="sub">Atividades: Desenvolvimento Web</text>
  <text x="455" y="235" class="small">Progresso: 2 de 6 concluídas (33%)</text>
  <rect x="700" y="225" width="420" height="12" rx="6" class="barbg"/><rect x="700" y="225" width="140" height="12" rx="6" class="bar"/>
  <rect x="455" y="260" width="330" height="360" rx="8" class="card"/>
  <text x="470" y="285" class="sub">Pendentes</text>
  <text x="470" y="315" class="small">3. HTML</text><rect x="680" y="298" width="90" height="24" rx="4" class="btnp"/><text x="697" y="314" class="btnt">Concluir</text>
  <text x="470" y="350" class="small">4. CSS</text><rect x="680" y="333" width="90" height="24" rx="4" class="btnp"/><text x="697" y="349" class="btnt">Concluir</text>
  <text x="470" y="385" class="small">5. JavaScript</text><rect x="680" y="368" width="90" height="24" rx="4" class="btnp"/><text x="697" y="384" class="btnt">Concluir</text>
  <text x="470" y="420" class="small">6. Projeto web</text><rect x="680" y="403" width="90" height="24" rx="4" class="btnp"/><text x="697" y="419" class="btnt">Concluir</text>
  <rect x="805" y="260" width="320" height="360" rx="8" class="card"/>
  <text x="820" y="285" class="sub">Concluídas</text>
  <text x="820" y="315" class="donet">✓ 1. Fundamentos da tecnologia</text>
  <text x="820" y="340" class="donet">✓ 2. Introdução à programação</text>
</svg>
