<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="Arial, Helvetica, sans-serif">
  <style>
    .title{font-size:20px;font-weight:700;fill:#111}.label{font-size:16px;font-weight:700;fill:#1f2937}
    .sub{font-size:13px;fill:#374151}.small{font-size:12px;fill:#374151}.muted{font-size:12px;fill:#6b7280}
    .frame{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}.header{fill:#e5e7eb;stroke:#94a3b8}
    .box{fill:#fff;stroke:#cbd5e1}.arrow{stroke:#374151;stroke-width:2;fill:none;marker-end:url(#a)}
    .flashok{fill:#dcfce7;stroke:#86efac}.flashokt{font-size:11px;fill:#166534}
  </style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker></defs>
  <rect width="100%" height="100%" fill="#fff"/>
  <text x="40" y="40" class="title">11 - Logout (ação) — protegido</text>
  <text x="40" y="62" class="muted">Não possui tela de conteúdo própria. Fluxo: clicar "Sair" → encerra sessão → redirect Home com [flash sucesso] "Você saiu da sua conta."</text>

  <text x="40" y="105" class="label">FLUXO (aplica a celular e desktop)</text>
  <rect x="40" y="125" width="1120" height="360" class="frame"/>

  <rect x="80" y="230" width="220" height="80" rx="8" class="box"/>
  <text x="120" y="262" class="sub" font-weight="700">Usuário logado</text>
  <text x="110" y="285" class="small">Clica em "Sair" no menu</text>

  <line x1="300" y1="270" x2="370" y2="270" class="arrow"/>
  <rect x="370" y="220" width="240" height="100" rx="8" class="box"/>
  <text x="420" y="255" class="sub" font-weight="700">Ação de logout</text>
  <text x="395" y="278" class="small">POST/CSRF (conforme impl.)</text>
  <text x="430" y="298" class="small">Encerra sessão</text>

  <line x1="610" y1="270" x2="680" y2="270" class="arrow"/>
  <rect x="680" y="220" width="180" height="100" rx="8" class="box"/>
  <text x="730" y="262" class="sub" font-weight="700">Redirect</text>
  <text x="705" y="285" class="small">para Home (ou Login)</text>

  <line x1="860" y1="270" x2="930" y2="270" class="arrow"/>
  <rect x="930" y="200" width="200" height="140" rx="8" class="box"/>
  <text x="995" y="235" class="sub" font-weight="700">Home</text>
  <rect x="945" y="250" width="170" height="26" rx="4" class="flashok"/>
  <text x="952" y="267" class="flashokt">[flash sucesso] Você saiu</text>
  <text x="952" y="279" class="flashokt">da sua conta.</text>
  <text x="965" y="305" class="small">Conteúdo da Home</text>

  <text x="80" y="380" class="muted">Celular: "Sair" aparece no menu [≡]. Desktop: "Sair" aparece no cabeçalho (conforme componentes globais em TELAS.md).</text>
</svg>
